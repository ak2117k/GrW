# Builds the API image on every push to main and publishes it to GHCR as
#   ghcr.io/<owner>/grw-api:<commit sha>
# The production host (a 2 GB VPS) never builds: scripts/deploy/deploy.sh waits
# for this image, pulls it, migrates and swaps. A 2 GB box cannot run the pnpm
# install + nest build without swapping itself to a standstill.
#
# Platform: linux/amd64 for the x86 VPS. Add linux/arm64 here if the host ever
# moves to an ARM machine (e.g. Oracle A1) — the deploy script needs no change.
name: api-image

on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual rebuild

concurrency:
  group: api-image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: img
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grw-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
            ${{ steps.img.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
