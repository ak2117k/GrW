# Keep-warm — RETIRED. No schedule; manual dispatch only.
#
# This pinged the API every 10 min so Render's free web service never hit its
# ~15-min sleep timer (a 30-90s cold start made the frontend show a bogus
# "Unable to sign in"). It was switched off once to save GitHub Actions minutes
# and Neon compute, and is now pointless: production moved off Render to the
# Vyom VPS (https://157-10-98-70.sslip.io), and a VPS process does not sleep.
#
# The schedule trigger is removed, not commented out: do not add one back. The
# workflow_dispatch run remains as a one-click liveness check of /healthz/live
# (no database touched).

name: keep-warm

on:
  workflow_dispatch: {} # manual run, for checking the endpoint by hand

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API: https://157-10-98-70.sslip.io
    steps:
      - name: Check liveness (no database touched)
        run: |
          # --retry rides out a deploy restart in progress.
          code=$(curl -sS -m 120 --retry 3 --retry-all-errors -o /tmp/live.json -w "%{http_code}" \
            "$API/healthz/live")
          echo "healthz/live HTTP $code"; cat /tmp/live.json 2>/dev/null; echo
          case "$code" in 2*) : ;; *) echo "::error::healthz/live returned $code"; exit 1 ;; esac
