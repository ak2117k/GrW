# GrW production stack — one 2 GB Mumbai VPS (see docs/deploy/ORACLE-RUNBOOK.md).
# Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.prod.yml --env-file /opt/grw/env/compose.env up -d
# Only Caddy is public (80/443, HTTPS via Let's Encrypt on the free <ip>.sslip.io
# name). The API binds 127.0.0.1 only, for the deploy health check.
# Memory is sized for 2 GB RAM + 2 GB swap: ~512 MB Postgres, 128 MB Redis, rest API.
name: grw

# Every service rotates its json logs; unbounded logs eventually fill the 100 GB disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    logging: *logging
    # Pinned by digest (2026-10-19) to the exact image prod runs: TimescaleDB 2.30.2 on PG 17.11.
    # `latest-pg17` let any re-create silently pull a new Timescale (extension upgrade / breakage).
    # To upgrade: pick the new digest deliberately, take a backup, run the restore test, then
    # ALTER EXTENSION timescaledb UPDATE.
    image: timescale/timescaledb:latest-pg17@sha256:b346edcdb51a1fd6020e3965e0bd1c9f3406fa6d5fbce1e28f4852587ef934e2
    container_name: grw-postgres
    # Docker's default 64 MB /dev/shm is too small for parallel query workers
    # ("could not resize shared memory segment").
    shm_size: 256m
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    # Sized for a 2 GB host that also runs the API and Redis. Raise these if the
    # host grows (12 GB: shared_buffers=2GB, effective_cache_size=6GB, work_mem=16MB).
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=40
      -c timescaledb.telemetry_level=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    logging: *logging
    image: redis:7-alpine
    container_name: grw-redis
    restart: unless-stopped
    # noeviction: Bull queues must never have keys evicted under memory pressure.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    logging: *logging
    image: grw-api:${GRW_API_TAG:-current}
    container_name: grw-api
    restart: unless-stopped
    env_file:
      # Overridable only so the file can be validated off-server (docker compose config).
      - ${API_ENV_FILE:-/opt/grw/env/api.env}
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}?connection_limit=10
      DIRECT_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      # Postgres is reached over this stack's private network (no TLS listener).
      DATABASE_ALLOW_PLAINTEXT: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: "false"
      REDIS_ALLOW_PLAINTEXT: "true"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # SP3 entry scorer + decision-corpus retrieval (ai-engine/Dockerfile, src.scorer_main).
  # Internal only: no host ports, no Caddy route; the API reaches it at http://ai-engine:5000
  # via AI_SCORER_URL (NOT AI_ENGINE_URL, which still serves ai-advisor / weekly-report).
  # Off until the owner enables `--profile ai` after measuring headroom (spec §6.5).
  ai-engine:
    logging: *logging
    image: grw-ai-engine:${GRW_AI_TAG:-current}
    container_name: grw-ai-engine
    restart: unless-stopped
    mem_limit: 384m
    environment:
      MODELS_DIR: /models
      # The scorer assembles its DB URL from these parts with every component
      # percent-escaped (ai-engine/src/scorer/db_url.py), so any password works.
      AI_DB_USER: grw_ai
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      AI_DB_HOST: postgres
      AI_DB_PORT: "5432"
      AI_DB_NAME: ${PG_DB}
    volumes:
      - /opt/grw/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["ai"]

  # MBM (market behaviour model) serving, M2 observe-only: NIFTY 30m/60m move predictions every
  # 5 min into mbm_predictions; the API reaches it at http://mbm:5100 (MBM_URL). Internal only.
  # Image is built ON the VPS by scripts/deploy/mbm-deploy.sh (not CI, not the API deploy timer),
  # which also sets GRW_MBM_TAG. No profile: `up -d mbm` starts it. deploy.sh only ever touches
  # `api` (--no-deps), so API deploys never start, pull or recreate this service. A bare full-stack
  # `up -d` before the first mbm-deploy.sh run would fail to pull grw-mbm:current; mbm-deploy.sh
  # tags every healthy build as :current so that path works afterwards.
  mbm:
    logging: *logging
    image: grw-mbm:${GRW_MBM_TAG:-current}
    container_name: grw-mbm
    restart: unless-stopped
    mem_limit: 300m
    environment:
      MODELS_DIR: /models
      MBM_INSTRUMENTS: ${MBM_INSTRUMENTS:-NIFTY}
      # Same percent-escaped URL assembly as the scorer (ai-engine/src/scorer/db_url.py).
      AI_DB_USER: grw_ai
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      AI_DB_HOST: postgres
      AI_DB_PORT: "5432"
      AI_DB_NAME: ${PG_DB}
    volumes:
      - /opt/grw/models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    logging: *logging
    image: caddy:2-alpine
    container_name: grw-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api

volumes:
  pgdata: {}
  redisdata: {}
  caddydata: {}
