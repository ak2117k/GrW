# Docker Compose for local development infrastructure
# Usage: docker-compose up -d
# This starts PostgreSQL and Redis only — app services run natively for faster dev

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: td-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: td_automation
    ports:
      - "5432:5432"
    volumes:
      - td_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: td-redis
    ports:
      - "6379:6379"
    volumes:
      - td_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  td_postgres_data:
  td_redis_data:
