# Render Blueprint — free-tier GrW API (paper mode).
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect github.com/ak2117k/GrW
# (branch main). Render reads this file, builds apps/api/Dockerfile from the repo
# root, and prompts for every `sync: false` secret. See
# docs/deploy/FREE-DEPLOY-RUNBOOK.md for the full walkthrough.
services:
  - type: web
    name: grw-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    branch: main
    # GET /api/docs serves Swagger UI (HTTP 200). The app has no dedicated
    # /health route, and Swagger is always mounted, so it is a valid liveness
    # probe. Render also needs the app to bind 0.0.0.0:$PORT (handled in main.ts).
    healthCheckPath: /api/docs
    autoDeploy: true
    envVars:
      # --- Runtime mode ---
      - key: NODE_ENV
        value: production
      - key: PAPER_TRADING
        value: "true"
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: BILLING_PROVIDER
        value: fake
      - key: LIVE_BILLING_ENABLED
        value: "false"

      # --- Secrets (entered in the Render dashboard; never committed) ---
      # 32+ char random string. node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
      - key: JWT_SECRET
        sync: false
      # MUST be >= 32 chars in production (validate-boot-config asserts it) and
      # must NOT be the public default sentinel. Same generator as above.
      - key: ENCRYPTION_KEY
        sync: false
      # Neon POOLED connection string. MUST contain sslmode=require (prod boot
      # check rejects it otherwise). APPEND &connect_timeout=30 — Neon free-tier
      # compute autosuspends, and the first query after idle needs >5s (Prisma's
      # default) to wake it or it fails P1001. e.g.
      # postgresql://user:pass@ep-xxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require&connect_timeout=30
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT (unpooled) string — same value as DATABASE_URL but with the
      # host WITHOUT `-pooler`. Prisma Migrate uses this; migrate deploy HANGS on
      # the pooled PgBouncer endpoint (advisory lock). Keep sslmode=require.
      # postgresql://user:pass@ep-xxx.<region>.aws.neon.tech/neondb?sslmode=require
      - key: DIRECT_URL
        sync: false

      # --- CORS (fail-closed): the Cloudflare Pages origin, no trailing slash ---
      # Login and every browser call 500 / are blocked if this is wrong.
      # e.g. https://grw.pages.dev  (comma-separate to allow more than one)
      - key: WEB_ORIGIN
        sync: false

      # --- Chartink webhook ---
      # Shared secret sent as a HEADER (never in the URL — Render's access logs
      # record request paths, and this value is the whole auth boundary for a
      # public route). MUST be set or every webhook is 401'd.
      # Point Chartink's alert action at
      #   URL:    https://grw-api.onrender.com/webhooks/chartink
      #   header: X-Chartink-Webhook-Secret: <CHARTINK_WEBHOOK_SECRET>
      # ROTATE this: the previous path-secret value was logged in plaintext.
      - key: CHARTINK_WEBHOOK_SECRET
        sync: false

      # --- ML pattern-quality ops triggers ---
      # Shared secret for the ML data-capture triggers, sent as a HEADER for the
      # same reason as above. Until this is set the triggers reject EVERY request
      # (fail-closed), so pattern backfill never runs and no training data is
      # produced from history.
      # An external heartbeat (cron-job.org / UptimeRobot — both support custom
      # headers) POSTs, with header  X-ML-Trigger-Secret: <this-value> , to
      #   https://grw-api.onrender.com/webhooks/ml/backfill         (202, detached)
      #   https://grw-api.onrender.com/webhooks/ml/resolve-pending  (200, sync)
      # Driven externally because the free plan spins the service down when idle,
      # so an in-process @Cron would simply never fire.
      # Generate: node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      - key: ML_TRIGGER_SECRET
        sync: false

      # --- Redis (Render Key Value, INTERNAL endpoint) ---
      # The app reads REDIS_HOST/REDIS_PORT/REDIS_PASSWORD (NOT REDIS_URL).
      # Use Render Key Value's INTERNAL connection: it lives on Render's private
      # network so it always resolves (external Upstash did NOT resolve from
      # Render — getaddrinfo ENOTFOUND). Internal traffic is plaintext, so
      # REDIS_TLS=false + REDIS_ALLOW_PLAINTEXT=true (acknowledges the private-net
      # tradeoff; boot otherwise requires TLS). Leave REDIS_FAMILY unset — the
      # private network may be IPv6, so do NOT force IPv4.
      # (For an external TLS Redis instead: REDIS_TLS=true, drop ALLOW_PLAINTEXT.)
      - key: REDIS_TLS
        value: "false"
      - key: REDIS_ALLOW_PLAINTEXT
        value: "true"
      - key: REDIS_THROTTLER
        value: "true"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false

      # --- AI engine ---
      # Prod boot requires an https URL even though the free stack ships no AI
      # sidecar (paper mode never calls it). A placeholder https URL satisfies
      # the check; calls will simply fail closed if anything ever hits it.
      - key: AI_ENGINE_URL
        value: https://ai-engine.invalid
